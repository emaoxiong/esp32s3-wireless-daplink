name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set target and build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Merge binary for easy flashing
        run: |
          . $IDF_PATH/export.sh
          cd build
          esptool.py --chip esp32s3 merge_bin -o esp32s3_wireless_daplink_merged.bin @flash_args

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-wireless-daplink-firmware
          path: |
            build/esp32s3_wireless_daplink_merged.bin
            build/tusb_composite.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin